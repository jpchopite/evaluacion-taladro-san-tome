<style>
/* Layout: hero band (title + animated rig + tabs) over a calm page. Wizard = sticky "depth" rail on the left (desktop) + question cards; glass nav pinned to the bottom. Results reuse the same tokens. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #e9eef3;
  --ink: #0f1b2a;
  --ink-2: #475569;
  --muted: #7d8a9b;
  --line: #e1e7ee;
  --accent: #15507f;
  --accent-2: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e3eef9;
  --amber: #f0a500;
  --amber-ink: #1f1600;
  --amber-soft: #fff4d9;
  --series-hoy: #2a78d6;
  --series-antes: #8a8f96;
  --good: #108a3e;
  --good-soft: #e2f4e9;
  --critical: #c23434;
  --band: #0a1624;
  --band-2: #143657;
  --band-ink: #f2f5f9;
  --band-ink-2: #a8b6c7;
  --shadow: 0 1px 2px rgba(15, 27, 42, .05), 0 10px 28px -16px rgba(15, 27, 42, .22);
  --shadow-lg: 0 2px 6px rgba(15, 27, 42, .06), 0 22px 44px -18px rgba(15, 27, 42, .32);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f16; --surface: #121a24; --surface-2: #1b2531; --ink: #edf1f5; --ink-2: #b3bfcc; --muted: #8592a3;
    --line: #233041; --accent: #6aa6dd; --accent-2: #86b6ef; --accent-ink: #08111b; --accent-soft: #15283c;
    --amber: #f2b324; --amber-ink: #1f1600; --amber-soft: #2c2410; --series-hoy: #3987e5; --series-antes: #8a8f96;
    --good: #37c06d; --good-soft: #10301e; --critical: #e66767;
    --band: #050b12; --band-2: #0f2740; --band-ink: #edf1f5; --band-ink-2: #8f9db0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -16px rgba(0, 0, 0, .6);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 22px 44px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f16; --surface: #121a24; --surface-2: #1b2531; --ink: #edf1f5; --ink-2: #b3bfcc; --muted: #8592a3;
  --line: #233041; --accent: #6aa6dd; --accent-2: #86b6ef; --accent-ink: #08111b; --accent-soft: #15283c;
  --amber: #f2b324; --amber-ink: #1f1600; --amber-soft: #2c2410; --series-hoy: #3987e5; --series-antes: #8a8f96;
  --good: #37c06d; --good-soft: #10301e; --critical: #e66767;
  --band: #050b12; --band-2: #0f2740; --band-ink: #edf1f5; --band-ink-2: #8f9db0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -16px rgba(0, 0, 0, .6);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 22px 44px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1.05; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: 13px; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Hero ---------- */
.band { position: relative; overflow: hidden; color: var(--band-ink); background: radial-gradient(120% 150% at 88% -20%, var(--band-2) 0%, var(--band) 62%); }
.band::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 36px 36px; -webkit-mask-image: linear-gradient(to bottom, #000 10%, transparent 85%); mask-image: linear-gradient(to bottom, #000 10%, transparent 85%); }
.band-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: flex-end; padding-top: 14px; pointer-events: none; }
.theme-btn { all: unset; pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--band-ink-2); font-size: 12.5px; font-weight: 600; transition: color .2s, border-color .2s, background .2s; }
.theme-btn:hover { color: var(--band-ink); border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
.theme-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.theme-btn svg { width: 16px; height: 16px; }
.theme-btn .ic-sun, .is-dark .theme-btn .ic-moon { display: none; }
.is-dark .theme-btn .ic-sun { display: inline; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 460px); gap: 24px; align-items: end; padding-block: 60px 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--band-ink-2); font-weight: 600; }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--amber); border-radius: 2px; }
.band h1 { font-size: clamp(44px, 8.5vw, 84px); text-transform: uppercase; margin-top: 12px; line-height: .92; letter-spacing: .005em; }
.band h1 span { display: block; color: var(--amber); }
.hero-copy p { margin: 16px 0 0; color: var(--band-ink-2); max-width: 46ch; font-size: 17px; }
.hero-meta { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.hero-meta li { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--band-ink-2); font-size: 14px; }
.hero-meta b { font-family: var(--font-mono); color: var(--band-ink); font-weight: 600; }
.vz { align-self: center; width: 100%; display: grid; gap: 10px; color: var(--band-ink); }
.vz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.vz-kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--band-ink-2); font-weight: 600; }
.vz-tabs { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
.vz-tabs button { all: unset; cursor: pointer; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--band-ink-2); transition: background .2s var(--ease), color .2s var(--ease); }
.vz-tabs button:hover { color: var(--band-ink); }
.vz-tabs button[aria-selected="true"] { background: var(--amber); color: var(--amber-ink); }
.vz button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.vz-stage { position: relative; aspect-ratio: 1.3; }
.vz-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.vz-info { position: absolute; left: 0; bottom: 0; width: 44%; min-width: 180px; padding: 10px 12px 11px; border-radius: 12px; background: color-mix(in srgb, var(--band) 80%, transparent); border: 1px solid rgba(255,255,255,.1); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 14px 30px -18px rgba(0,0,0,.7); }
.vz-info .t { display: block; font-size: 14px; font-weight: 700; color: var(--amber); line-height: 1.25; }
.vz-info .m { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--band-ink-2); margin-top: 3px; }
.vz-info p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--band-ink); }
.vz-info ul { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; padding: 0; list-style: none; }
.vz-info li { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--band-ink-2); }
.vz-info.swap { animation: vzin .3s var(--ease); }
@keyframes vzin { from { opacity: 0; transform: translateY(5px); } }
.vz-legend { display: flex; flex-wrap: nowrap; gap: 6px; min-height: 30px; overflow-x: auto; scrollbar-width: none; }
.vz-legend::-webkit-scrollbar { display: none; }
.vz-legend button { flex: none; }
.vz-legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; font-size: 12px; color: var(--band-ink-2); border: 1px solid rgba(255,255,255,.1); transition: color .2s, border-color .2s, background .2s; }
.vz-legend button i { width: 7px; height: 7px; border-radius: 2px; background: var(--amber); opacity: .55; transition: opacity .2s, transform .2s; }
.vz-legend button.on, .vz-legend button:hover { color: var(--band-ink); border-color: color-mix(in srgb, var(--amber) 60%, transparent); background: rgba(255,255,255,.05); }
.vz-legend button.on i { opacity: 1; transform: scale(1.3); }
.vz-legend b { font-family: var(--font-mono); font-weight: 600; color: var(--amber); }
.vz-legend .prog { position: relative; overflow: hidden; }
.vz-legend .prog::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--amber); transform-origin: left; animation: vzprog 3.2s linear; }
@keyframes vzprog { from { transform: scaleX(0); } }
.rig { width: 100%; height: auto; color: var(--band-ink-2); overflow: visible; }
.rig .ground { stroke: currentColor; stroke-width: 1.5; opacity: .5; }
.rig .s1 { fill: var(--amber); opacity: .2; } .rig .s2 { fill: #6aa6dd; opacity: .16; } .rig .s3 { fill: var(--amber); opacity: .1; }
.rig .pipe { stroke: var(--amber); stroke-width: 3; stroke-dasharray: 7 5; animation: spin 0.9s linear infinite; }
.rig .bit { fill: var(--amber); animation: bob 2.6s var(--ease) infinite alternate; }
.rig .beacon { fill: var(--amber); animation: blink 1.8s ease-in-out infinite; }
@keyframes spin { to { stroke-dashoffset: -24; } }
@keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(2px); } }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.tabs { position: relative; display: inline-flex; gap: 4px; padding: 4px; margin: 30px 0 22px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--band-ink-2); padding: 8px 18px; font-family: var(--font-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; border-radius: 9px; transition: background .25s var(--ease), color .25s var(--ease); }
.tab[aria-selected="true"] { background: var(--band-ink); color: var(--band); }
.tab:hover:not([aria-selected="true"]) { color: var(--band-ink); background: rgba(255,255,255,.06); }
.stripe { height: 8px; background: repeating-linear-gradient(135deg, var(--amber) 0 12px, var(--band) 12px 24px); }
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; padding-block: 56px 0; }
  .theme-lbl { display: none; }
  .theme-btn { padding: 0; width: 32px; justify-content: center; }
  .rig, .vz { display: none; }
  .hero-copy p { font-size: 16px; }
}

main .wrap { padding-block: 32px 72px; }
body.compact .hero { padding-block: 52px 0; }
body.compact .hero-copy p, body.compact .hero-meta, body.compact .rig, body.compact .vz { display: none; }
body.compact .band h1 { font-size: clamp(30px, 5vw, 46px); margin-top: 8px; }
body.compact .band h1 span { display: inline; }
body.compact .tabs { margin: 16px 0 14px; }
body.compact main .wrap { padding-top: 24px; }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; color: var(--ink-2); margin-bottom: 20px; display: flex; gap: 10px; align-items: flex-start; box-shadow: var(--shadow); }
.notice strong { color: var(--ink); }
.notice.warn { border-color: color-mix(in srgb, var(--amber) 60%, var(--line)); }
.notice.err { border-color: color-mix(in srgb, var(--critical) 60%, var(--line)); }
.notice .ico { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--ink); }

/* ---------- Buttons ---------- */
.btn { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 11px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: transform .15s var(--ease), box-shadow .2s var(--ease), background .2s, border-color .2s, filter .2s; }
.btn:hover { border-color: var(--muted); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, white), var(--accent)); border-color: transparent; color: var(--accent-ink); box-shadow: 0 8px 18px -10px var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.amber { background: linear-gradient(180deg, color-mix(in srgb, var(--amber) 80%, white), var(--amber)); border-color: transparent; color: var(--amber-ink); box-shadow: 0 10px 22px -10px var(--amber); font-weight: 700; }
.btn.amber:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.danger { color: var(--critical); }
.btn.sm { padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn .i { width: 18px; height: 18px; transition: transform .2s var(--ease); }
.btn.go:hover .i { transform: translateX(3px); }
.btn.nudge { animation: nudge .8s var(--ease); }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateX(6px); } 60% { transform: translateX(-2px); } }

/* ---------- Entrance animations ---------- */
.anim-in { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.qlist > * { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
.qlist.from-left > * { animation-name: slide-l; }
.qlist.from-right > * { animation-name: slide-r; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes slide-r { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes slide-l { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }

/* ---------- Group chooser ---------- */
.choose { display: grid; gap: 22px; }
.choose-head h2 { font-size: clamp(32px, 5vw, 44px); text-transform: uppercase; margin-top: 6px; }
.choose-head p { color: var(--ink-2); margin: 8px 0 0; max-width: 60ch; font-size: 17px; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
@media (min-width: 720px) { .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.group-card { position: relative; overflow: hidden; text-align: left; appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 24px 24px 22px; cursor: pointer; display: grid; gap: 12px; align-content: start; box-shadow: var(--shadow); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s; animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms + 80ms); }
.group-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--tone); }
.group-card::after { content: ""; position: absolute; width: 220px; height: 220px; right: -90px; top: -110px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--tone) 18%, transparent), transparent); transition: transform .5s var(--ease); pointer-events: none; }
.group-card[data-tone="maestria"] { --tone: var(--accent-2); --tone-soft: var(--accent-soft); }
.group-card[data-tone="pregrado"] { --tone: var(--amber); --tone-soft: var(--amber-soft); }
.group-card[data-tone="ucab"] { --tone: #1f9d78; --tone-soft: color-mix(in srgb, #1f9d78 16%, var(--surface)); }
.group-card[data-tone="unimet"] { --tone: #8a5bd6; --tone-soft: color-mix(in srgb, #8a5bd6 16%, var(--surface)); }
.group-card.soon { --tone: var(--line); --tone-soft: var(--surface-2); cursor: default; background: color-mix(in srgb, var(--surface) 70%, var(--bg)); border-style: dashed; }
.group-card.soon::before { background: repeating-linear-gradient(135deg, var(--muted) 0 8px, transparent 8px 16px); opacity: .35; }
.group-card.soon::after { display: none; }
.group-card.soon:hover, .group-card.soon:active { transform: none; box-shadow: none; border-color: var(--line); }
.group-card.soon .gc-icon { color: var(--muted); }
.group-card.soon .n { color: var(--ink-2); }
.group-card.soon .d { color: var(--muted); }
.group-card.soon .gc-cta { color: var(--muted); font-weight: 600; font-size: 14px; }
.group-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); }
.group-card:hover::after { transform: scale(1.25); }
.group-card:active { transform: translateY(-1px) scale(.99); }
.group-card.picked { transform: scale(.98); border-color: var(--tone); }
.gc-top { display: flex; justify-content: space-between; align-items: center; }
.gc-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--tone-soft); color: var(--ink); }
.gc-icon svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gc-tag { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
.group-card .n { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.group-card .d { color: var(--ink-2); font-size: 15px; }
.gc-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.gc-meta .gc-test { background: var(--amber-soft); color: var(--ink); border: 1px dashed color-mix(in srgb, var(--amber) 70%, transparent); }
.gc-meta span { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
.gc-cta { margin-top: 4px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); }
.gc-cta .i { transition: transform .25s var(--ease); }
.group-card:hover .gc-cta .i { transform: translateX(5px); }
.how { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.how li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 60%, transparent); border: 1px dashed var(--line); }
.how-ico { width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.how strong { display: block; font-size: 15px; }
.how span { color: var(--ink-2); font-size: 14px; }
.draft-card { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 16px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); }
.dc-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--amber); color: var(--amber-ink); flex: none; }
.dc-txt { flex: 1 1 200px; display: grid; }
.dc-txt span { color: var(--ink-2); font-size: 14px; }
.dc-act { display: flex; gap: 6px; }

/* ---------- Wizard ---------- */
.wiz { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
.wiz-main { min-width: 0; }
.rail { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 18px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.rail-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.depth { display: grid; gap: 2px; padding: 14px; border-radius: 12px; background: var(--band); color: var(--band-ink); position: relative; overflow: hidden; }
.depth::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: repeating-linear-gradient(135deg, var(--amber) 0 8px, transparent 8px 16px); opacity: .8; }
.depth .dl { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--band-ink-2); font-weight: 600; }
.depth .dv { font-family: var(--font-mono); font-size: 26px; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; }
.depth .dt { font-size: 12px; color: var(--band-ink-2); font-family: var(--font-mono); }
.drill-top { display: flex; justify-content: flex-start; margin-bottom: -18px; position: relative; z-index: 2; }
/* The derrick's centre (x=60 of 120 → 48px at 96px wide) sits exactly over the shaft (1px border + 23px + 2px = 26px). */
.drill-top svg { width: 96px; height: auto; margin-left: -22px; color: var(--ink-2); overflow: visible; }
.drill-top .mpipe { stroke: var(--amber); stroke-width: 5; stroke-dasharray: 8.75 3.75; }
.rail.drilling .drill-top .mpipe { animation: spin-mini .35s linear infinite; }
@keyframes spin-mini { to { stroke-dashoffset: -12.5; } }
.drill-top .beacon { fill: var(--amber); animation: blink 1.8s ease-in-out infinite; }
.strata-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.strata { list-style: none; margin: 0; padding: 0; display: grid; }
.strata li { position: relative; transition: background .4s var(--ease); }
.strata li:nth-child(odd) { background: color-mix(in srgb, var(--amber) 8%, var(--surface)); }
.strata li:nth-child(even) { background: color-mix(in srgb, var(--accent-2) 7%, var(--surface)); }
.strata li.st-cur { background: color-mix(in srgb, var(--accent-2) 16%, var(--surface)); }
.strata li + li { border-top: 1px dashed color-mix(in srgb, var(--muted) 30%, transparent); }
.strata button { appearance: none; border: 0; background: transparent; width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 52px; margin: 0; text-align: left; cursor: pointer; color: var(--ink-2); font-size: 14px; line-height: 1.25; }
.strata button:disabled { cursor: default; }
.strata button:not(:disabled):hover { color: var(--ink); }
.strata .node { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); z-index: 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 16px; font-weight: 700; border: 2px solid var(--line); background: var(--surface); color: var(--muted); transition: all .35s var(--ease); }
.strata li.st-done .node { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.strata li.st-cur .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation: pulse 2s infinite; }
.strata li.st-cur .sl { color: var(--ink); font-weight: 700; }
.strata li.st-todo .sl { color: var(--muted); }
.shaft { position: absolute; left: 23px; top: 0; width: 4px; height: 0; z-index: 1; transition: height .8s var(--ease); pointer-events: none; }
.shaft .pipe { position: absolute; inset: 0; border-radius: 2px; background: repeating-linear-gradient(180deg, var(--amber) 0 7px, color-mix(in srgb, var(--amber) 45%, var(--band)) 7px 10px); }
.bit { position: absolute; left: 14px; top: 0; width: 22px; height: 24px; z-index: 4; pointer-events: none; transition: top .8s var(--ease); filter: drop-shadow(0 2px 2px rgba(0,0,0,.28)); }
.bit svg { width: 100%; height: 100%; display: block; transform-origin: 50% 10%; }
.rail.drilling .shaft .pipe { animation: drillspin .35s linear infinite; }
.rail.drilling .bit svg { animation: bitwob .12s linear infinite alternate; }
@keyframes drillspin { from { background-position: 0 0; } to { background-position: 0 10px; } }
@keyframes bitwob { 0% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(1px) rotate(0); } 100% { transform: translateY(0) rotate(4deg); } }
.cut { position: absolute; z-index: 3; width: 5px; height: 5px; border-radius: 1px; background: var(--amber); pointer-events: none; animation: cut .8s var(--ease) forwards; }
.cut:nth-child(3n) { background: color-mix(in srgb, var(--amber) 50%, var(--band)); }
@keyframes cut { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(160deg); opacity: 0; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.mtop { display: none; }
.mtop-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mtop .mono { font-size: 14px; color: var(--ink-2); }
.mtop .mono b { color: var(--ink); }
.mbar { position: relative; height: 8px; margin-top: 16px; border-radius: 999px; background: var(--surface-2); }
.mbar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: linear-gradient(90deg, var(--amber), color-mix(in srgb, var(--amber) 70%, var(--accent-2))); transition: width .6s var(--ease); }
.mbar b { position: absolute; top: 50%; width: 20px; height: 22px; margin-top: -11px; margin-left: -4px; transform: rotate(-90deg); transition: left .8s var(--ease); }
.mbar b svg { width: 100%; height: 100%; display: block; }
.mbar i { background-image: repeating-linear-gradient(90deg, var(--amber) 0 7px, color-mix(in srgb, var(--amber) 55%, var(--band)) 7px 10px); }
.mtop.drilling .mbar i { animation: drillspin-x .35s linear infinite; }
.mtop.drilling .mbar b svg { animation: bitwob .12s linear infinite alternate; }
@keyframes drillspin-x { from { background-position: 0 0; } to { background-position: 10px 0; } }
@media (max-width: 900px) {
  .wiz { grid-template-columns: 1fr; gap: 0; }
  .rail { display: none; }
  .mtop { display: block; margin-bottom: 18px; }
}

.step-head { display: grid; gap: 8px; margin-bottom: 22px; }
.step-head h2 { font-size: clamp(32px, 5vw, 46px); text-transform: uppercase; }
.step-head .help { color: var(--ink-2); margin: 0; max-width: 64ch; font-size: 16px; }
.count { justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); transition: background .3s, color .3s, border-color .3s; }
.count b { font-family: var(--font-mono); color: var(--ink); }
.count.full { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 35%, transparent); color: var(--good); }
.count.full b { color: var(--good); }

.qlist { display: grid; gap: 14px; }
.q { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); transition: border-color .3s var(--ease), box-shadow .3s var(--ease); }
.q:focus-within { border-color: color-mix(in srgb, var(--accent-2) 45%, var(--line)); }
.q.is-done { border-color: color-mix(in srgb, var(--good) 35%, var(--line)); }
.q .ok { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #fff; transform: scale(0); transition: transform .4s var(--ease-back); }
.q .ok .i { width: 15px; height: 15px; stroke-width: 3; }
.q.is-done .ok { transform: scale(1); }
.q.missing { border-color: var(--critical); animation: shake .45s var(--ease); }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.q .qt { font-weight: 650; font-size: 17px; margin: 0 0 4px; padding-right: 34px; line-height: 1.4; }
.q .qh { color: var(--muted); font-size: 14px; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.q .req { color: var(--critical); margin-left: 2px; }
.q .miss { color: var(--critical); font-size: 14px; margin-top: 10px; display: none; font-weight: 600; }
.q.missing .miss { display: block; }
.mcount { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.subhead { padding-top: 14px; display: flex; align-items: center; gap: 12px; }
.subhead::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--amber); transform: rotate(45deg); flex: none; }
.subhead h3 { font-size: 22px; text-transform: uppercase; color: var(--ink); }
.subhead p { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }

.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; transition: background .2s var(--ease), border-color .2s var(--ease), transform .12s var(--ease); }
.opt:hover { border-color: color-mix(in srgb, var(--accent-2) 50%, var(--line)); }
.opt:active { transform: scale(.99); }
.opt input { appearance: none; -webkit-appearance: none; margin: 0; width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: border-color .2s, background .2s; }
.opt input::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .3s var(--ease-back); }
.opt input:checked { border-color: var(--accent); }
.opt input:checked::after { transform: scale(1); }
.opt input[type="checkbox"] { border-radius: 7px; }
.opt input[type="checkbox"]::after { width: 6px; height: 11px; border-radius: 0; background: transparent; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) scale(0); margin-top: -2px; }
.opt input[type="checkbox"]:checked { background: var(--accent); }
.opt input[type="checkbox"]:checked::after { transform: rotate(45deg) scale(1); }
.opt:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.opt:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.otra { margin-left: 36px; margin-top: 2px; }
.consent { margin: 2px 0 12px; color: var(--ink-2); line-height: 1.6; max-width: 70ch; }
.seg label.na span { min-width: 0; padding: 0 14px; font-family: var(--font-body); font-size: 13px; font-weight: 600; }
.seg label.na input:checked + span { background: var(--muted); color: var(--surface); box-shadow: none; }
.opts.chips { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
.opts.chips .opt { position: relative; justify-content: center; padding: 12px 6px; font-family: var(--font-mono); font-weight: 600; }
.opts.chips .opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; }
.opts.chips .opt:last-child { grid-column: 1 / -1; font-family: var(--font-body); }
.opts.chips .opt:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .35s var(--ease-back); }
.opts.chips .opt:has(input:focus-visible) { outline: 2px solid var(--accent-2); outline-offset: 2px; }
input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, box-shadow .2s, background .2s; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus { outline: none; border-color: var(--accent-2); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 18%, transparent); }

/* Segmented 1–5 / 0–10 */
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: grid; place-items: center; min-width: 46px; height: 46px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums; cursor: pointer; transition: transform .18s var(--ease), background .25s var(--ease), color .25s, border-color .25s, box-shadow .25s; }
.seg label:hover span { border-color: var(--accent-2); transform: translateY(-2px); }
.seg input:checked + span { background: var(--lvl, var(--accent)); color: var(--lvl-ink, var(--accent-ink)); border-color: transparent; box-shadow: 0 8px 16px -8px var(--lvl, var(--accent)); animation: pop .35s var(--ease-back); }
.seg input:focus-visible + span { outline: 2px solid var(--accent-2); outline-offset: 2px; }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
.scale-labels { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin-top: 8px; max-width: 560px; }

.matrix { display: grid; gap: 0; margin-top: 6px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 12px 10px; margin: 0 -10px; border-top: 1px solid var(--line); border-radius: 10px; transition: background .25s var(--ease); }
.mrow:first-child { border-top: 0; }
.mrow:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.mlabel { display: flex; gap: 10px; align-items: flex-start; }
.mlabel::before { content: ""; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; flex: none; background: var(--line); transition: background .3s, transform .3s var(--ease-back); }
.mrow.row-done .mlabel::before { background: var(--good); transform: scale(1.2); }
.mrow.missing .mlabel { color: var(--critical); }
.mrow.missing .mlabel::before { background: var(--critical); }
.mscales { display: grid; gap: 6px; justify-items: end; }
.masp { display: flex; gap: 8px; align-items: center; }
.masp .al { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; min-width: 70px; text-align: right; }
.mrow .seg span { min-width: 38px; height: 38px; border-radius: 10px; }
@media (max-width: 720px) {
  .mrow { grid-template-columns: 1fr; }
  .mscales { justify-items: start; padding-left: 18px; }
  .masp { flex-wrap: wrap; }
  .masp .al { text-align: left; min-width: 0; width: 100%; }
  .q { padding: 18px 16px; }
}

.wiz-nav { position: sticky; bottom: 0; z-index: 5; margin-top: 22px; padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow-lg); }
.nav-mid { flex: 1; min-width: 0; display: grid; justify-items: center; text-align: center; }
.nav-mid > * { grid-area: 1 / 1; }
.wiz-nav .err-msg { color: var(--critical); font-size: 14px; font-weight: 600; }
.saved { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--good); font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .3s, transform .3s var(--ease); }
.saved .i { width: 14px; height: 14px; stroke-width: 3; }
.saved.show { opacity: 1; transform: none; }
.err-msg:not(:empty) + .saved { display: none; }
@media (max-width: 420px) { .nav-inner .btn span { display: none; } .nav-inner .btn.go span, .nav-inner .btn.amber span { display: inline; } }

/* ---------- Done ---------- */
.done { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(24px, 5vw, 44px); display: grid; gap: 14px; justify-items: center; text-align: center; box-shadow: var(--shadow-lg); }
.done::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: repeating-linear-gradient(135deg, var(--amber) 0 12px, var(--band) 12px 24px); }
.badge-depth { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--amber-soft); color: var(--ink); font-family: var(--font-mono); font-size: 13px; font-weight: 600; border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); }
.badge-depth .i { width: 15px; height: 15px; stroke-width: 3; color: var(--amber); }
.done h2 { font-size: clamp(36px, 6vw, 54px); text-transform: uppercase; }
.done > p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.score { position: relative; width: 168px; height: 168px; margin: 6px 0; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--amber); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); }
.score-num { position: absolute; inset: 0; display: grid; place-content: center; }
.score-num b { font-family: var(--font-display); font-size: 58px; line-height: .9; }
.score-num span { color: var(--ink-2); font-size: 14px; }
.verdict { font-family: var(--font-display); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--accent) !important; }
.done .sub { font-size: 14px; color: var(--muted); }
.ptiles { list-style: none; margin: 0 0 10px; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 620px; }
.ptiles li { display: grid; gap: 4px; padding: 10px 6px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); animation: rise .5s var(--ease) both; animation-delay: calc(var(--n) * 70ms + 400ms); }
.pt-n { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.pt-v { font-family: var(--font-mono); font-weight: 600; }
.pt-bar { height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.pt-bar i { display: block; height: 100%; width: calc(var(--k) * 100%); background: var(--good); border-radius: 999px; }
@media (max-width: 560px) { .ptiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.bgfx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; }

/* Results */
.res-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: end; margin-bottom: 18px; }
.res-head h2 { font-size: 32px; text-transform: uppercase; }
.res-head p { margin: 2px 0 0; color: var(--ink-2); }
.toggle { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.toggle button { appearance: none; border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--ink-2); }
.toggle button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.res-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.kpi .s { color: var(--ink-2); font-size: 14px; }
.kpi .v .u { font-size: 18px; color: var(--ink-2); font-weight: 600; }
.up { color: var(--good); }

.ipr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
.ipr > div { padding: 16px 18px; border-left: 1px solid var(--line); min-width: 0; }
.ipr > div:first-child { border-left: 0; }
.ipr h3 { font-size: 22px; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; }
.ipr h3 small { font-family: var(--font-body); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.ipr .lead { color: var(--ink-2); font-size: 14px; margin: 2px 0 10px; }
.ipr dl { margin: 0; display: grid; gap: 8px; }
.ipr dl > div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.ipr dt { color: var(--ink-2); font-size: 14px; }
.ipr dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) { .ipr { grid-template-columns: 1fr; } .ipr > div { border-left: 0; border-top: 1px solid var(--line); } .ipr > div:first-child { border-top: 0; } }

.db-row .lab { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.db-track { position: relative; height: 22px; }
.db-track .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }

}

/* Horizontal bars */
.hb { display: grid; gap: 8px; }

@media (max-width: 640px) { .hb-row { grid-template-columns: minmax(0, 1fr) 3rem; } .hb-row .lab { grid-column: 1 / -1; } }

async function login(email, password) {
  const res = await fetch(`${API}/auth/v1/token?grant_type=password`, { method: 'POST', headers: headers(), body: JSON.stringify({ email, password }) });
  if (!res.ok) throw await apiError(res);
  const j = await res.json();
  setSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user && j.user.email });
}
async function refresh() {
  if (!session || !session.refresh_token) throw new Error('sin sesión');
  const res = await fetch(`${API}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: headers(), body: JSON.stringify({ refresh_token: session.refresh_token }) });
  if (!res.ok) { setSession(null); throw await apiError(res); }
  const j = await res.json();
  setSession({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user && j.user.email });
}
async function authed(path, opts = {}) {
  if (!session) throw new Error('sin sesión');
  if (Date.now() > session.expires_at - 60000) await refresh();
  let res = await fetch(API + path, { ...opts, headers: headers(session.access_token, opts.headers) });
  if (res.status === 401) { await refresh(); res = await fetch(API + path, { ...opts, headers: headers(session.access_token, opts.headers) }); }
  if (!res.ok) throw await apiError(res);
  return res;
}

}

  } else if (it.t === 'consent') {

  } else if (it.t === 'multi') {

    if (it.otra) opts.push(`<label class="opt"><input type="checkbox" name="q_${id}" id="q_${id}_otra" data-q="${it.id}" data-k="multi" value="__otra" ${arr.includes('__otra') ? 'checked' : ''}><span>Otra</span></label>
      <div class="otra"><input type="text" id="q_${id}_otxt" data-q="${it.id}" data-k="otra" placeholder="Especifique" value="${esc(st.r[it.id + '_otra'] || '')}"></div>`);

  } else if (it.t === 'scale') {
    const btns = [];
    for (let n = it.min; n <= it.max; n++) btns.push(`<label style="${lvlStyle(n, it.min, it.max)}"><input type="radio" name="q_${id}" id="q_${id}_${n}" data-q="${it.id}" data-k="scale" value="${n}" ${v === n ? 'checked' : ''}><span>${n}</span></label>`);

          + (it.na ? `<label class="na"><input type="radio" name="m_${id}_${ai}_${ri}" id="m_${id}_${ai}_${ri}_0" data-q="${it.id}" data-k="matrix" data-a="${ai}" data-row="${ri}" value="0" ${cur === 0 ? 'checked' : ''}><span>No aplica</span></label>` : '');

  return `<div class="q ${answered(it) ? 'is-done' : ''}" id="w_${id}" style="--i:${Math.min(idx, 8)}" ${isVisible(it) ? '' : 'hidden'}><span class="ok" aria-hidden="true">${ICON.check}</span><p class="qt">${esc(it.q)}${reqMark}</p>${help}${body}<div class="miss">Falta responder esta pregunta.</div></div>`;

let shaftPx = 0, drillTimer = 0;
function drillTo(frac) {
  const total = GRUPOS[st.grupo].pasos.length;
  const prog = Math.min(1, (st.paso + frac) / total);
  const wrap = document.getElementById('strata-wrap'), shaft = document.getElementById('shaft');
  if (wrap && shaft) {
    const lis = wrap.querySelectorAll('.strata li'), li = lis[st.paso];
    if (li) { shaftPx = Math.round(li.offsetTop + Math.max(0.12, frac) * li.offsetHeight); shaft.style.height = shaftPx + 'px'; const bit = document.getElementById('bit'); if (bit) bit.style.top = (shaftPx - 3) + 'px'; }
  }
  const bar = document.querySelector('.mbar i'), mk = document.querySelector('.mbar b');
  if (bar) bar.style.width = (prog * 100) + '%';
  if (mk) mk.style.left = (prog * 100) + '%';
  animateDepth(Math.round(prog * TOTAL_DEPTH));
}
function drillPulse() {
  const rail = document.querySelector('.rail'), mtop = document.querySelector('.mtop');
  if (!rail || reduceMotion()) return;
  rail.classList.add('drilling'); if (mtop) mtop.classList.add('drilling'); clearTimeout(drillTimer);
  drillTimer = setTimeout(() => { rail.classList.remove('drilling'); if (mtop) mtop.classList.remove('drilling'); }, 1100);
  const wrap = document.getElementById('strata-wrap'); if (!wrap) return;
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('span'); c.className = 'cut';
    const ang = Math.PI * (0.15 + Math.random() * 0.7) * (i % 2 ? 1 : -1);
    c.style.left = '22px'; c.style.top = (shaftPx + 6) + 'px';
    c.style.setProperty('--dx', (Math.sin(ang) * (14 + Math.random() * 22)).toFixed(1) + 'px');
    c.style.setProperty('--dy', (-Math.abs(Math.cos(ang)) * (10 + Math.random() * 18)).toFixed(1) + 'px');
    wrap.appendChild(c); setTimeout(() => c.remove(), 850);
  }
}
function updateCount() {
  const el = $('#count'); if (!el || !st.grupo) return;
  const items = GRUPOS[st.grupo].pasos[st.paso].items.filter(i => i.t !== 'h' && isVisible(i));
  const n = items.filter(answered).length;
  const part = items.reduce((acc, it) => acc + (it.t === 'matrix' ? rowsDoneCount(it) / Math.max(1, visRows(it).length) : (answered(it) ? 1 : 0)), 0);
  drillTo(items.length ? part / items.length : 0);
  el.innerHTML = n === items.length ? `${ICON.check}<b>${n}</b> de ${items.length} respondidas` : `<b>${n}</b> de ${items.length} respondidas`;
  el.classList.toggle('full', n === items.length);
}
function refreshCard(it) {
  const w = document.getElementById('w_' + domId(it.id)); if (!w) return false;
  const ok = answered(it), was = w.classList.contains('is-done');
  w.classList.toggle('is-done', ok);
  if (ok) w.classList.remove('missing');
  if (it.t === 'matrix') { const mc = document.getElementById('mc_' + domId(it.id)); if (mc) mc.textContent = `${rowsDoneCount(it)}/${visRows(it).length}`; }
  updateCount();
  return ok && !was;
}

function readInput(el) {
  const q = el.dataset.q, k = el.dataset.k;
  if (!q) return;
  const it = itemById(st.grupo, q);
  if (k === 'text') st.r[q] = el.value;
  else if (k === 'otra') {
    st.r[q + '_otra'] = el.value;
    if (it.t === 'single' && el.value.trim()) { st.r[q] = '__otra'; const rb = document.getElementById(`q_${domId(q)}_otra`); if (rb) rb.checked = true; }
    if (it.t === 'multi' && el.value.trim()) { const cb = document.getElementById(`q_${domId(q)}_otra`); if (cb && !cb.checked) { cb.checked = true; readInput(cb); return; } }
  }
  else if (k === 'consent') st.r[q] = el.checked;
  else if (k === 'single') st.r[q] = el.value;
  else if (k === 'quiz' || k === 'scale') st.r[q] = Number(el.value);
  else if (k === 'multi') {
    const boxes = [...document.querySelectorAll(`input[name="q_${domId(q)}"]`)];
    if (it.excl && el.checked) boxes.forEach(b => { if (b !== el && (el.value === it.excl || b.value === it.excl)) b.checked = false; });
    st.r[q] = boxes.filter(b => b.checked).map(b => b.value);
    if (it.lim) { const full = st.r[q].length >= it.lim; boxes.forEach(b => { if (!b.checked) b.disabled = full; }); }
  } else if (k === 'matrix') {
    const a = Number(el.dataset.a), row = Number(el.dataset.row);
    if (!Array.isArray(st.r[q])) st.r[q] = it.asp.map(() => it.rows.map(() => null));
    st.r[q][a][row] = Number(el.value);
    const rowEl = document.getElementById(`mr_${domId(q)}_${row}`);
    if (rowEl) { const d = rowDone(it, row); rowEl.classList.toggle('row-done', d); if (d) rowEl.classList.remove('missing'); }
  }
  if (st.grupo === 'pregrado' && q === 'A2') st.r.A3 = etapaDeSemestre(st.r.A2);
  applyConds();
  const justDone = refreshCard(it);
  if (k !== 'text' && k !== 'otra') { buzz(justDone ? [10, 30, 14] : 6); drillPulse(); }
  else if (justDone) drillPulse();
  saveDraft(); flashSaved();
  if ((k === 'single' && el.value !== '__otra') || k === 'quiz' || k === 'scale') autoAdvance(el.closest('.q'));
}

let advTimer = 0;
function autoAdvance(card) {
  if (!card) return;
  clearTimeout(advTimer);
  advTimer = setTimeout(() => {
    let n = card.nextElementSibling;
    while (n && !n.classList.contains('q')) n = n.nextElementSibling;
    if (!n) { const go = $('#siguiente'); if (go && !go.disabled) { go.classList.remove('nudge'); void go.offsetWidth; go.classList.add('nudge'); } return; }
    if (n.classList.contains('is-done')) return;
    if (n.getBoundingClientRect().top > window.innerHeight * 0.6) n.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
  }, 280);
}

function answered(it) {
  const v = st.r[it.id];
  switch (it.t) {
    case 'text': case 'para': return it.kind === 'cedula' ? String(v || '').replace(/\D/g, '').length >= 5 : !!(v && String(v).trim());
    case 'single': return !!v && (v !== '__otra' || !!(st.r[it.id + '_otra'] || '').trim());
    case 'quiz': case 'scale': return typeof v === 'number';
    case 'consent': return v === true;
    case 'multi': return Array.isArray(v) && v.length > 0;
    case 'matrix': return Array.isArray(v) && it.rows.every((_, ri) => !rowVisible(it, ri) || rowDone(it, ri));
  }
  return true;
}

function validateStep() {
  const paso = GRUPOS[st.grupo].pasos[st.paso];
  let first = null;
  paso.items.forEach(it => {
    if (it.t === 'h' || !it.req || !isVisible(it)) return;
    const w = document.getElementById('w_' + domId(it.id));
    const ok = answered(it);
    if (w) { w.classList.remove('missing'); if (!ok) { void w.offsetWidth; w.classList.add('missing'); } }
    if (it.t === 'matrix') {
      it.rows.forEach((_, ri) => {
        const done = !rowVisible(it, ri) || rowDone(it, ri);
        const rowEl = document.getElementById(`mr_${domId(it.id)}_${ri}`);
        if (rowEl) rowEl.classList.toggle('missing', !done);
        if (!done && !first) first = rowEl;
      });
    }
    if (!ok && !first) first = w;
  });
  if (first) { buzz([30, 50, 30]); first.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }); }
  return !first;
}

function goTo(p, dir) {
  st.paso = p; st.maxPaso = Math.max(st.maxPaso || 0, p); st.error = '';
  saveDraft(); renderResponder(dir); scrollToView();
}
function bindStep() {
  const shaft = document.getElementById('shaft');
  const bitEl = document.getElementById('bit');
  if (shaft) { shaft.style.transition = 'none'; shaft.style.height = shaftPx + 'px'; if (bitEl) { bitEl.style.transition = 'none'; bitEl.style.top = (shaftPx - 3) + 'px'; } void shaft.offsetHeight; shaft.style.transition = ''; if (bitEl) bitEl.style.transition = ''; }
  const form = $('#stepform');
  form.addEventListener('submit', e => e.preventDefault());
  form.addEventListener('change', e => readInput(e.target));
  form.addEventListener('input', e => { if (e.target.dataset.k === 'text' || e.target.dataset.k === 'otra') readInput(e.target); });
  updateCount();
  $('#atras').addEventListener('click', () => { if (st.paso > 0) goTo(st.paso - 1, -1); });
  const toChooser = () => { st.grupo = null; st.paso = 0; st.error = ''; renderResponder(); scrollToView(); };
  $('#cambiar').addEventListener('click', toChooser);
  $('#cambiar-m').addEventListener('click', toChooser);
  document.querySelectorAll('.strata [data-goto]').forEach(b => b.addEventListener('click', () => { const i = Number(b.dataset.goto); goTo(i, i < st.paso ? -1 : 1); }));
  $('#siguiente').addEventListener('click', async () => {
    if (!validateStep()) { st.error = 'Faltan preguntas por responder.'; $('#errmsg').textContent = st.error; return; }
    st.error = ''; $('#errmsg').textContent = '';
    const total = GRUPOS[st.grupo].pasos.length;
    if (st.paso < total - 1) { buzz(12); goTo(st.paso + 1, 1); return; }
    await enviar();
  });
}

function puntaje(g, r) {
  const qs = quizItems(g);
  const aciertos = qs.filter(q => r[q.id] === q.ok).length;
  return { aciertos, total: qs.length };
}

function limpiar(r) {
  const out = {};
  for (const [k, v] of Object.entries(r)) {
    if (v == null) continue;
    if (typeof v === 'string' && !v.trim()) continue;
    out[k] = typeof v === 'string' ? v.trim().slice(0, 4000) : v;
  }
  return out;
}

async function enviar() {
  allItems(st.grupo).forEach(it => {
    if (it.showIf && !isVisible(it)) delete st.r[it.id];
    if (it.t === 'matrix' && it.rowIf && Array.isArray(st.r[it.id])) it.rows.forEach((_, ri) => { if (!rowVisible(it, ri)) it.asp.forEach((_, ai) => { st.r[it.id][ai][ri] = null; }); });
  });
  const { aciertos, total } = puntaje(st.grupo, st.r);
  if (!configured) {
    st.error = 'La página aún no está conectada a la base de datos. Avise al organizador.';
    $('#errmsg').textContent = st.error; return;
  }
  if (GRUPOS[st.grupo].prueba) {
    store.del(DRAFT_KEY);
    st.done = { aciertos, total, grupo: st.grupo, prueba: true, paradas: [] };
    st.error = ''; renderResponder(); scrollToView(); return;
  }
  st.sending = true; renderResponder();
  const doc = { grupo: st.grupo, codigo: String(st.r.A1 || '').trim().replace(/\s+/g, ' ').slice(0, 80), aciertos, total_quiz: total, r: limpiar(st.r) };
  try {
    const res = await fetch(`${API}/rest/v1/respuestas`, { method: 'POST', headers: headers(null, { Prefer: 'return=minimal' }), body: JSON.stringify(doc) });
    if (!res.ok) throw await apiError(res);
    store.del(DRAFT_KEY);
    st.done = { aciertos, total, grupo: st.grupo, paradas: PARADAS.map((_, pi) => { const qs = quizItems(st.grupo).filter(q => q.p === pi + 1); return { n: qs.length, ok: qs.filter(q => st.r[q.id] === q.ok).length }; }) };
    st.sending = false; st.error = '';
    renderResponder(); scrollToView();
  } catch (e) {
    st.sending = false;
    st.error = 'No se pudo enviar. Revise su conexión y pulse Enviar de nuevo; sus respuestas siguen aquí.';
    renderResponder();
  }
}

function doneView() {

  return `<div class="done anim-in">

    <div class="score" role="img" aria-label="${steps} de ${steps} etapas completadas">
      <svg viewBox="0 0 120 120" class="ring" aria-hidden="true"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringfg" style="stroke-dasharray:${C};stroke-dashoffset:${C}"/></svg>
      <div class="score-num"><b id="scnum">0</b><span>de ${steps} etapas</span></div>
    </div>
    <p class="verdict">Cuestionario completo</p>

}
function bindDone() {
  const d = st.done;
  const steps = GRUPOS[d.grupo].pasos.length;
  setTimeout(() => { const fg = $('#ringfg'); if (fg) fg.style.strokeDashoffset = '0'; }, 80);
  const el = $('#scnum'), t0 = performance.now(), dur = reduceMotion() ? 0 : 1200;
  const tick = now => { const p = dur ? Math.min(1, (now - t0) / dur) : 1; if (el) el.textContent = Math.round(steps * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  if (!d.celebrated) { d.celebrated = true; setTimeout(confetti, 250); buzz([20, 60, 20, 60, 40]); }
  $('#otra').addEventListener('click', () => { Object.assign(st, { grupo: null, paso: 0, maxPaso: 0, r: {}, done: null, error: '' }); shownDepth = 0; renderResponder(); scrollToView(); });
}
function confetti() {
  if (reduceMotion()) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext('2d'); if (!x) { c.remove(); return; }
  x.scale(dpr, dpr);
  const cols = ['#f0a500', '#ffd46b', '#2a78d6', '#86b6ef', '#15507f', '#37c06d'];
  const P = Array.from({ length: 150 }, (_, i) => {
    const side = i % 2 ? 1 : -1;
    return { x: W / 2 + side * W * 0.18, y: H * 0.42, vx: side * (2 + Math.random() * 9) * -1 + (Math.random() - .5) * 4, vy: -(6 + Math.random() * 11), w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: cols[(Math.random() * cols.length) | 0] };
  });
  const t0 = performance.now();
  const step = now => {
    const t = now - t0;
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += 0.3; p.vx *= 0.988; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r);
      x.globalAlpha = Math.max(0, 1 - t / 2800); x.fillStyle = p.c;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.7)) + 2);
      x.restore();
    }
    if (t < 2900) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

async function loadResults() {
  if (!configured || !session || loading) return;
  loading = true;
  try {
    const res = await authed('/rest/v1/respuestas?select=*&order=enviado.desc&limit=5000');
    const data = await res.json();
    all = data.map(x => ({ id: x.id, grupo: x.grupo, enviado: x.enviado, codigo: x.codigo, aciertos: x.aciertos, totalQuiz: x.total_quiz, r: x.r || {} }));
    resultsLoaded = true; resultsError = null; updatedAt = new Date();
  } catch (e) {
    if (!session) resultsError = null; else resultsError = e.message || 'error';
  }
  loading = false;
  if (!$('#view-resultados').hidden) renderResultados();
}
function subscribeResults() { if (session && !resultsLoaded && !resultsError) loadResults(); }
setInterval(() => { if (session && resultsLoaded && !$('#view-resultados').hidden && document.visibilityState === 'visible') loadResults(); }, 60000);

function loginView() {
  return `<div class="panel login"><h3>Acceso del organizador</h3><p class="sub">Los resultados solo los ve quien administra la evaluación. Para responder el cuestionario, use la pestaña Responder.</p>
    <form id="loginform" novalidate>
      <label for="lg_email">Correo</label><input type="email" id="lg_email" autocomplete="username" required>
      <label for="lg_pass">Contraseña</label><input type="password" id="lg_pass" autocomplete="current-password" required>
      <p class="err-msg" id="lg_err" role="alert"></p>
      <button class="btn primary" id="lg_btn">Entrar</button>
    </form></div>`;
}
function bindLogin() {
  $('#loginform').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#lg_email').value.trim(), pass = $('#lg_pass').value;
    if (!email || !pass) { $('#lg_err').textContent = 'Escriba su correo y su contraseña.'; return; }
    $('#lg_btn').disabled = true; $('#lg_btn').textContent = 'Entrando…'; $('#lg_err').textContent = '';
    try { await login(email, pass); renderResultados(); loadResults(); }
    catch (err) { $('#lg_btn').disabled = false; $('#lg_btn').textContent = 'Entrar'; $('#lg_err').textContent = err.status === 400 ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar. Revise su conexión e intente de nuevo.'; }
  });
}

function textOf(it, v, r) {
  if (v == null) return '';
  if (v === '__otra') return 'Otra: ' + (r[it.id + '_otra'] || '');
  if (Array.isArray(v) && it.t === 'multi') return v.map(x => x === '__otra' ? 'Otra: ' + (r[it.id + '_otra'] || '') : x).join('; ');
  if (it.t === 'quiz') return it.op[v] ?? '';
  return String(v);
}

function analyze(g, rows) {
  const n = rows.length;
  const items = Object.fromEntries(allItems(g).map(i => [i.id, i]));
  const R = rows.map(x => x.r || {});
  const B = items.B;
  const bAntes = B.rows.map((_, i) => mean(R.map(r => r.B?.[0]?.[i])));
  const bHoy = B.rows.map((_, i) => mean(R.map(r => r.B?.[1]?.[i])));
  const perPerson = R.map(r => mean(B.rows.map((_, i) => (r.B?.[1]?.[i] ?? NaN) - (r.B?.[0]?.[i] ?? NaN))));
  const ganancia = mean(perPerson);
  const normGain = mean(R.flatMap(r => B.rows.map((_, i) => { const a = r.B?.[0]?.[i], h = r.B?.[1]?.[i]; if (a == null || h == null || a >= 5) return NaN; return (h - a) / (5 - a); })));
  const mejora = n ? R.filter(r => mean(B.rows.map((_, i) => (r.B?.[1]?.[i] ?? NaN) - (r.B?.[0]?.[i] ?? NaN))) >= 1).length / n : null;
  const qs = quizItems(g);
  const comp = mean(rows.map(x => x.totalQuiz ? x.aciertos / x.totalQuiz : NaN));
  const porParada = PARADAS.map((_, pi) => { const qq = qs.filter(q => q.p === pi + 1); if (!qq.length) return null; return mean(R.flatMap(r => qq.map(q => typeof r[q.id] === 'number' ? (r[q.id] === q.ok ? 1 : 0) : NaN))); });
  const porPregunta = qs.map(q => ({ q, v: mean(R.map(r => typeof r[q.id] === 'number' ? (r[q.id] === q.ok ? 1 : 0) : NaN)) }));
  const C0 = items.C0;
  const c0 = C0.asp.map((_, ai) => PARADAS.map((_, pi) => mean(R.map(r => r.C0?.[ai]?.[pi]))));
  const f12 = mean(R.map(r => r.F1_2)), f21 = mean(R.map(r => r.F2_1));
  const e5 = R.map(r => r.E5).filter(x => typeof x === 'number');
  const nps = e5.length ? (e5.filter(x => x >= 9).length - e5.filter(x => x <= 6).length) / e5.length * 100 : null;
  const share = (id, pred) => { const vals = R.map(r => r[id]).filter(v => v != null); return vals.length ? vals.filter(pred).length / vals.length : null; };
  const counts = (id) => { const it = items[id]; const m = new Map((it.op || []).map(o => [o, 0])); R.forEach(r => { const v = r[id]; const arr = Array.isArray(v) ? v : (v != null ? [v] : []); arr.forEach(x => { const key = x === '__otra' ? 'Otra' : (it.t === 'quiz' ? it.op[x] : x); m.set(key, (m.get(key) || 0) + 1); }); }); return [...m.entries()]; };
  const matrixMeans = id => items[id].rows.map((_, i) => mean(R.map(r => { const x = r[id]?.[0]?.[i]; return x >= 1 ? x : NaN; })));
  const matrixTop2 = id => items[id].rows.map((_, i) => { const vals = R.map(r => r[id]?.[0]?.[i]).filter(x => typeof x === 'number' && x >= 1); return vals.length ? vals.filter(x => x >= 4).length / vals.length : null; });
  const f31 = matrixTop2('F3_1');
  const d1 = matrixMeans('D1');
  const e1 = matrixMeans('E1');
  const segItem = items[GRUPOS[g].seg.id] || GRUPOS[g].seg.item;
  const segVals = segItem.op ? [...segItem.op, ...(segItem.otra ? ['Otra'] : [])] : [...new Set(R.map(r => String(r[segItem.id] || '').trim()).filter(Boolean))].sort((a, b) => Number(a) - Number(b));
  const segKey = r => { const v = r[segItem.id]; return v === '__otra' ? 'Otra' : String(v ?? '').trim(); };
  const segs = segVals.map(s => { const sub = rows.filter(x => segKey(x.r || {}) === s); if (!sub.length) return null; const RR = sub.map(x => x.r || {});
    return { s, n: sub.length, comp: mean(sub.map(x => x.totalQuiz ? x.aciertos / x.totalQuiz : NaN)), gan: mean(RR.map(r => mean(B.rows.map((_, i) => (r.B?.[1]?.[i] ?? NaN) - (r.B?.[0]?.[i] ?? NaN))))), f21: mean(RR.map(r => r.F2_1)), res: mean(RR.map(r => mean((r.F3_1?.[0] || []).map(x => x >= 4 ? 1 : 0)))) }; }).filter(Boolean);
  return { n, bAntes, bHoy, ganancia, normGain, mejora, comp, porParada, porPregunta, c0, f12, f21, nps, e5n: e5.length, f31, d1, e1,
    nunca: share('A5', v => v === 'Nunca'), sinHoras: share('F1_1', v => v === '0'), compMas50: share('F2_2', v => v === '51–75 %' || v === 'Más de 75 %'),
    recursos: counts('F1_3').sort((a, b) => b[1] - a[1]), e3: counts('E3'), e2: counts('E2'), f22: counts('F2_2'), segs,
    bAntesM: mean(bAntes), bHoyM: mean(bHoy), f31M: mean(f31), d1M: mean(d1.map((m, i) => (items.D1.rev || []).includes(i) && m != null ? 6 - m : m)), items };
}

const RAMP = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
function heat(v) { if (v == null) return { bg: 'transparent', fg: 'var(--muted)' }; const t = Math.max(0, Math.min(1, (v - 1) / 4)); const i = Math.round(t * (RAMP.length - 1)); return { bg: RAMP[i], fg: i >= 3 ? '#ffffff' : '#0b1b2e' }; }

function hbars(rows, max, fmt) {
  return `<div class="hb">${rows.map(([lab, v, tip]) => `<div class="hb-row"><div class="lab">${esc(lab)}</div><div class="trk" data-tip="${esc(tip || (lab + ': ' + fmt(v)))}" tabindex="0"><div class="fill" style="width:${v == null ? 0 : Math.max(0, Math.min(100, v / max * 100))}%"></div></div><div class="val">${fmt(v)}</div></div>`).join('')}</div>`;
}

function dumbbell(labels, antes, hoy) {
  const x = v => ((v - 1) / 4) * 100;
  const ticks = [1, 2, 3, 4, 5];
  const grid = ticks.map(t => `<span class="gl" style="left:${x(t)}%"></span>`).join('');
  const rows = labels.map((lab, i) => {
    const a = antes[i], h = hoy[i];
    if (a == null || h == null) return '';
    const lo = Math.min(a, h), hi = Math.max(a, h), d = h - a;
    return `<div class="db-row"><div class="lab">${esc(lab)}</div>
      <div class="db-track" tabindex="0" data-tip="${esc(lab)} — Antes ${f1(a)} · Hoy ${f1(h)} (${sgn(d)})">${grid}
        <span class="bar" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></span>
        <span class="dot" style="left:${x(a)}%;background:var(--series-antes)"></span>
        <span class="dot" style="left:${x(h)}%;background:var(--series-hoy)"></span>
      </div><div class="delta ${d > 0 ? 'up' : ''}">${sgn(d)}</div></div>`;
  }).join('');
  return `<div class="legend"><span><i style="background:var(--series-antes)"></i>Antes de la visita</span><span><i style="background:var(--series-hoy)"></i>Hoy</span></div>
    ${rows}
    <div class="db-axis"><span></span><div class="ticks">${ticks.map(t => `<span style="left:${x(t)}%">${t}</span>`).join('')}</div><span class="dh">Cambio</span></div>`;
}

function renderResultados() {
  const v = $('#view-resultados');
  if (!configured) { v.innerHTML = `<div class="empty"><h3>Base de datos no configurada</h3><p>Falta conectar la página con Supabase.</p></div>`; return; }
  if (!session) { v.innerHTML = loginView(); bindLogin(); return; }
  if (resultsError) { v.innerHTML = `<div class="empty"><h3>No se pudieron cargar las respuestas</h3><p>${esc(resultsError)}</p><p><button class="btn" id="retry">Reintentar</button> <button class="btn ghost" id="salir">Salir</button></p></div>`; $('#retry').addEventListener('click', () => { resultsError = null; renderResultados(); loadResults(); }); $('#salir').addEventListener('click', async () => { await logout(); renderResultados(); }); return; }
  if (!resultsLoaded) { v.innerHTML = `<div class="empty"><h3>Cargando respuestas…</h3></div>`; return; }

  const g = resGrupo;
  const G = GRUPOS[g];
  const rows = all.filter(x => x.grupo === g).sort((a, b) => String(b.enviado).localeCompare(String(a.enviado)));

  const head = `<div class="res-head">
    <div><h2>Resultados</h2><p>${all.length} respuesta${all.length === 1 ? '' : 's'} registrada${all.length === 1 ? '' : 's'} <span class="updated">· actualizado ${updatedAt ? updatedAt.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) : ''}</span></p></div>
    <div class="res-actions">
      <div class="toggle" role="group" aria-label="Grupo">
        ${Object.entries(GRUPOS).map(([k, gg]) => `<button data-rg="${k}" aria-pressed="${g === k}">${esc(gg.uni === 'UCV' ? gg.corto : gg.uni)}${gg.prueba ? ' · prueba' : ''} (${all.filter(x => x.grupo === k).length})</button>`).join('')}
      </div>
      <button class="btn sm" id="refresh">Actualizar</button>
      <button class="btn sm" id="csv" ${all.length ? '' : 'disabled'}>Exportar CSV</button>
      <button class="btn ghost sm" id="logout">Salir</button>
    </div>
  </div>`;

  if (!rows.length) {
    v.innerHTML = head + `<div class="empty"><h3>Aún no hay respuestas de ${esc(G.corto)}</h3><p>Cuando un participante envíe el cuestionario desde la pestaña Responder, sus datos aparecerán aquí (pulse Actualizar o espere un minuto).</p></div>`;
    bindResultados(); return;
  }

  const a = analyze(g, rows);
  const items = a.items;

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="l">Respuestas</div><div class="v">${a.n}</div><div class="s">${esc(G.corto)}</div></div>
    <div class="kpi"><div class="l">Mejora percibida</div><div class="v ${a.ganancia > 0 ? 'up' : ''}">${sgn(a.ganancia)} <span class="u">pts</span></div><div class="s">Autoevaluación Hoy − Antes (1–5). No es una prueba de aprendizaje.</div></div>
    <div class="kpi"><div class="l">Experiencia</div><div class="v">${f1(mean(a.e1))}</div><div class="s">Calificación media de la visita, 1–5</div></div>
    <div class="kpi"><div class="l">Conocimiento general</div><div class="v">${f1(a.f12)} → ${f1(a.f21)}</div><div class="s">Antes → hoy, escala 1–10</div></div>
    <div class="kpi"><div class="l">Recomendación (NPS)</div><div class="v">${a.nps == null ? '—' : nf0.format(a.nps)}</div><div class="s">De −100 a +100 · ${a.e5n} respuestas</div></div>
  </div>`;

  const topRes = items.F3_1.rows.map((r, i) => [r, a.f31[i]]).sort((x, y) => (y[1] ?? -1) - (x[1] ?? -1))[0];
  const ipr = `<div class="ipr">
    <div><h3>Insumo <small>Punto de partida</small></h3><p class="lead">Con qué llegaron los participantes.</p><dl>

    </dl></div>
    <div><h3>Producto <small>Al salir</small></h3><p class="lead">Lo que obtuvieron de inmediato.</p><dl>
      <div><dt>Conocimiento hoy (1–10)</dt><dd>${f1(a.f21)}</dd></div>
      <div><dt>Nivel medio en los temas, hoy (1–5)</dt><dd>${f1(a.bHoyM)}</dd></div>
      <div><dt>Mejoraron al menos 1 punto</dt><dd>${pct(a.mejora)}</dd></div>
      <div><dt>Mejora percibida normalizada</dt><dd>${pct(a.normGain)}</dd></div>
      <div><dt>Dicen comprender más del 50 %</dt><dd>${pct(a.compMas50)}</dd></div>
    </dl></div>
    <div><h3>Resultado <small>Intención a 6 meses</small></h3><p class="lead">Lo que planean hacer con lo aprendido.</p><dl>
      <div><dt>Acciones con probabilidad 4 o 5</dt><dd>${pct(a.f31M)}</dd></div>
      <div><dt>Acción más probable</dt><dd style="white-space:normal;text-align:right">${esc(topRes ? topRes[0] : '—')}</dd></div>
      <div><dt>Acuerdo medio con el aporte (D1, 1–5)</dt><dd>${f1(a.d1M)}</dd></div>
    </dl></div>
  </div>`;

  const bPanel = `<div class="panel"><h3>Antes y después por tema</h3><p class="sub">Autoevaluación de cada participante (1–5): mejora percibida, no aprendizaje medido. El «antes» se respondió después de la visita.</p>${dumbbell(items.B.rows, a.bAntes, a.bHoy)}</div>`;

  const compPanel = `<div class="panel"><h3>Comprensión por parada</h3><p class="sub">Porcentaje de respuestas correctas en las preguntas de cada parada.</p>

    <div class="tscroll"><table><thead><tr><th>Parada</th>${items.C0.asp.map(x => `<th class="num">${esc(x)}</th>`).join('')}</tr></thead><tbody>
    ${PARADAS.map((p, pi) => `<tr><td>${pi + 1}. ${esc(p)}</td>${items.C0.asp.map((_, ai) => { const val = a.c0[ai][pi]; const h = heat(val); return `<td class="heat" style="background:${h.bg};color:${h.fg}">${f1(val)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;

  const qPanel = `<div class="panel"><h3>Aciertos por pregunta</h3><p class="sub">Identifica los conceptos que hay que reforzar en la próxima visita.</p>
    ${hbars(a.porPregunta.map(({ q, v: val }) => [q.q.split(' ')[0] + ' ' + q.q.split(' ').slice(1).join(' ').slice(0, 70) + (q.q.length > 75 ? '…' : ''), val, q.q + ' — correcta: ' + q.op[q.ok] + ' — ' + pct(val)]), 1, pct)}</div>`;

  const f31Panel = `<div class="panel"><h3>Resultado esperado</h3><p class="sub">Porcentaje que califica cada acción con 4 o 5 (probable en los próximos 6 meses).</p>
    ${hbars(items.F3_1.rows.map((r, i) => [r, a.f31[i]]), 1, pct)}</div>`;
  const d1Panel = `<div class="panel"><h3>${esc(G.d1Titulo)}</h3><p class="sub">Grado de acuerdo medio, escala 1–5.</p>
    ${hbars(items.D1.rows.map((r, i) => [r.replace(/^D1\.\d+\s*/, '') + ((items.D1.rev || []).includes(i) ? ' (en negativo: menos es mejor)' : ''), a.d1[i]]), 5, f1)}</div>`;
  const e1Panel = `<div class="panel"><h3>Experiencia</h3><p class="sub">Calificación media de 1 a 5.</p>
    ${hbars(items.E1.rows.map((r, i) => [r, a.e1[i]]), 5, f1)}</div>`;
  const e3max = Math.max(1, ...a.e3.map(x => x[1]));
  const e3Panel = `<div class="panel"><h3>Parada más valiosa</h3><p class="sub">Número de participantes que la eligieron.</p>
    ${hbars(a.e3.map(([k, c]) => [k, c]), e3max, x => x == null ? '—' : String(x))}</div>`;

  const segPanel = `<div class="panel"><h3>Por ${esc(G.seg.label.toLowerCase())}</h3><p class="sub">Compara si la visita funcionó igual para cada perfil.</p>

    </tbody></table></div></div>`;

  v.innerHTML = head + kpis + ipr + bPanel + `<div class="grid2">${c0Panel}${e3Panel}</div><div class="grid2">${f31Panel}${d1Panel}</div>` + e1Panel + segPanel + openPanel + listPanel;

    const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (m.s < 0.02) { m.x = x; m.y = y; }
    m.tx = x; m.ty = y; m.on = true;
    const h = hit(x, y); if (h) engage();
    if (h !== hover) { hover = h; setActive(); }
    canvas.style.cursor = h ? 'pointer' : 'crosshair';
    kick();
  });
  stage.addEventListener('pointerleave', () => { m.on = false; hover = null; setActive(); });
  stage.addEventListener('click', e => {
    const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, h = hit(x, y);
    engage(); pinned = h && pinned !== h ? h : null; hover = null;
    if (e.pointerType && e.pointerType !== 'mouse') { m.tx = m.x = x; m.ty = m.y = y; m.on = true; setTimeout(() => { m.on = false; kick(); }, 700); }
    setActive();
  });
  box.querySelectorAll('.vz-tabs button').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.layer)));
  box.querySelector('.vz-tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...box.querySelectorAll('.vz-tabs button')], i = tabs.findIndex(b => b.dataset.layer === layer);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; setLayer(n.dataset.layer); n.focus();
  });

  const recolor = () => { readCol(); kick(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', recolor);
  new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('visibilitychange', kick);
  if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; if (visible) kick(); })).observe(stage);
  const resize = () => { if (build()) { draw(performance.now()); kick(); } };
  readCol();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage); else addEventListener('resize', resize);
  setLayer('cuencas'); resize();
})();
</script>
<script>
/* Light / dark mode switch. Follows the device until the person picks one; the choice is remembered on this browser. */
(() => {
  const btn = document.getElementById('themeBtn'), root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  if (!btn) return;
  const current = () => root.dataset.theme || (mq.matches ? 'dark' : 'light');
  const paint = () => { const dark = current() === 'dark'; root.classList.toggle('is-dark', dark); btn.setAttribute('aria-label', dark ? 'Activar modo claro' : 'Activar modo oscuro'); btn.title = dark ? 'Modo claro' : 'Modo oscuro'; btn.querySelector('.theme-lbl').textContent = dark ? 'Modo claro' : 'Modo oscuro'; };
  btn.addEventListener('click', () => { const next = current() === 'dark' ? 'light' : 'dark'; root.dataset.theme = next; try { localStorage.setItem('tema', next); } catch (e) {} paint(); });
  mq.addEventListener?.('change', paint);
  paint();
})();
</script>
